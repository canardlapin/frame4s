name: Release

# The v* glob covers both stages of the declared release sequence: the
# immutable v0.1.0-RCn release-candidate tags and the stable v0.1.0 promotion
# tag route through this same Central Portal publication. RC artifacts carry
# no compatibility promise; docs/release-policy.md declares the soak gate
# between the two stages.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: sbt/setup-sbt@1f718a9acba84199353b2835642645f66393cae7 # v1
      # sbt 1.11+ supplies the Central Portal staging and release commands used
      # by sbt-ci-release 1.11.x. The normal support court remains on the
      # repository-pinned sbt 1.10.5.
      - run: sbt -sbt-version 1.12.11 formatCheck docsCheck apiDocs versionPolicyCheck compileAll testAll benchmarkSmoke ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Create the GitHub release entry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            "$GITHUB_REF_NAME"
            --verify-tag
            --title "frame4s ${GITHUB_REF_NAME#v}"
            --notes-file docs/release-notes/0.1.0.md
          )
          if [[ "$GITHUB_REF_NAME" =~ -RC[0-9]+$ ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"

  pages:
    needs: [publish, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@1f718a9acba84199353b2835642645f66393cae7 # v1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build the exact-tag documentation site
        run: sbt docs/tlSite
      - name: Upload the documentation site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: modules/docs/target/docs/site
      - name: Deploy the documentation site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
